plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "turtymultiloader-testmod-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

dependencies {
    implementation project(path: ':neoforge')
    implementation project(path: ':gas-neoforge')
    implementation project(path: ':slurry-neoforge')
    implementation project(path: ':multiblock-neoforge')

    // The loader projects compile these sources into their own output, but IntelliJ
    // models them as separate modules. Keep the module dependencies visible to the IDE.
    [':common', ':gas-common', ':slurry-common', ':multiblock-common'].each { commonProject ->
        compileOnly(project(commonProject)) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

neoForge {
    version = neoforge_version

    runs {
        gameTest {
            type = 'gameTestServer'
            ideName = 'TurtyMultiloader NeoForge GameTest'
            gameDirectory = file('runs/gametest')
            systemProperty('neoforge.enabledGameTestNamespaces', 'turtymultiloader_testmod')
        }
        data {
            clientData()
            ideName = 'TurtyMultiloader NeoForge Data Generation'
            gameDirectory = file('runs/datagen')
            programArguments.addAll(
                '--mod', 'turtymultiloader_testmod',
                '--all',
                '--output', file('build/generated-client-data').absolutePath,
                '--existing', file('src/main/resources').absolutePath
            )
        }
        serverData {
            serverData()
            ideName = 'TurtyMultiloader NeoForge Server Data Generation'
            gameDirectory = file('runs/serverDatagen')
            programArguments.addAll(
                '--mod', 'turtymultiloader_testmod',
                '--all',
                '--output', file('build/generated-server-data').absolutePath,
                '--existing', file('src/main/resources').absolutePath
            )
        }
    }

    mods {
        turtymultiloader_testmod {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property('version', project.version)
    inputs.property('minecraft_version_range', minecraft_version_range)
    inputs.property('neoforge_version', neoforge_version)
    inputs.property('neoforge_loader_version_range', neoforge_loader_version_range)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            version                      : project.version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version             : neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range
        ])
    }
}

plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "turtymultiloader-testmod-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${fabric_gametest_api_version}"
    implementation project(path: ':fabric')
    implementation project(path: ':gas-fabric')
    implementation project(path: ':slurry-fabric')
}

loom {
    runs {
        gameTest {
            server()
            setConfigName('TurtyMultiloader Fabric GameTest')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            property('fabric-api.gametest', 'true')
            property('fabric-api.gametest.report-file', file('build/gametest-results.xml').absolutePath)
        }
        dataGeneration {
            server()
            setConfigName('TurtyMultiloader Fabric Data Generation')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            property('fabric-api.datagen', 'true')
            property('fabric-api.datagen.modid', 'turtymultiloader_testmod')
            property('fabric-api.datagen.output-dir', file('build/generated-data').absolutePath)
        }
    }
}

processResources {
    inputs.property('version', project.version)
    inputs.property('minecraft_version', minecraft_version)
    inputs.property('fabric_loader_version', fabric_loader_version)
    inputs.property('fabric_api_version', fabric_api_version)
    filesMatching('fabric.mod.json') {
        expand([
            version              : project.version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version
        ])
    }
}

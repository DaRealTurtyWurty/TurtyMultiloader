pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TurtyMultiloader'

include('common')
include('fabric')
include('neoforge')
include('testmod-fabric')
project(':testmod-fabric').projectDir = file('testmod/fabric')
include('testmod-neoforge')
project(':testmod-neoforge').projectDir = file('testmod/neoforge')

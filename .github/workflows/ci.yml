name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, GameTest, datagen, and published-consumer verification
        run: ./gradlew check --stacktrace

      - name: Upload GameTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-reports
          if-no-files-found: ignore
          path: |
            testmod/fabric/build/gametest-results.xml
            testmod/neoforge/build/test-results/**

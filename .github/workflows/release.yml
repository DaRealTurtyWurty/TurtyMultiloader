name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Verify and publish consumer artifacts
        env:
          ORG_GRADLE_PROJECT_repsyUsername: ${{ secrets.REPSY_USERNAME }}
          ORG_GRADLE_PROJECT_repsyPassword: ${{ secrets.REPSY_PASSWORD }}
        run: ./gradlew check publishConsumerArtifactsToRepsy --stacktrace

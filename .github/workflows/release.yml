name: Publish release

on:
  push:
    branches:
      - 'release/1.0.1'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${project_version}"
          else
            test "${GITHUB_REF_NAME}" = "release/${project_version}"
          fi

      - name: Verify and publish consumer artifacts
        env:
          ORG_GRADLE_PROJECT_cloudsmithUsername: turty-wurty
          ORG_GRADLE_PROJECT_cloudsmithPassword: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          ./gradlew check --stacktrace
          ./gradlew publishConsumerArtifactsToCloudsmith --stacktrace

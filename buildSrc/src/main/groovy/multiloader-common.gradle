plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
        'version'                      : version,
        'group'                        : project.group,
        'minecraft_version'            : minecraft_version,
        'minecraft_version_range'      : minecraft_version_range,
        'fabric_loader_version'        : fabric_loader_version,
        'fabric_api_version'           : fabric_api_version,
        'fabric_gametest_api_version'  : fabric_gametest_api_version,
        'mod_name'                     : mod_name,
        'mod_author'                   : mod_author,
        'mod_id'                       : mod_id,
        'license'                      : license,
        'description'                  : project.description,
        'neoforge_version'             : neoforge_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'java_version'                 : java_version
    ]

    def jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Keep Maven coordinates stable across Minecraft versions. The
            // human-facing build JAR can still include the Minecraft version.
            artifactId "${mod_id}-${project.name}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'local'
            def configuredUrl = providers.gradleProperty('localMavenUrl')
                .orElse(providers.environmentVariable('LOCAL_MAVEN_URL'))
            url = configuredUrl.isPresent()
                ? uri(configuredUrl.get())
                : rootProject.layout.buildDirectory.dir('local-maven')
        }
        maven {
            name = 'repsy'
            url = uri('https://repo.repsy.io/mvn/turtywurty/public')
            credentials(PasswordCredentials)
        }
    }
}
